name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a CVE published after merge still surfaces.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false on every checkout — nothing here needs git
      # auth after the clone, and a stored token can leak via artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the image rather than google/osv-scanner-action, whose own
      # README warns its behavior can change in a patch release.
      #
      # Do not add --include-git-root. With it the checkout's .git counts as a
      # package, so a scan that finds no lockfile exits 0. Without it that scan
      # exits 128 and fails the step, and every bun.lock file is still scanned.
      #
      # The v2.5.1 tag is mutable, so the digest is what actually pins this.
      # Resolved with: docker buildx imagetools inspect ghcr.io/google/osv-scanner:v2.5.1
      - name: Scan lockfiles
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            ghcr.io/google/osv-scanner:v2.5.1@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --recursive /src

  zizmor:
    name: Workflow static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Audits the workflows themselves: template injection, over-broad
      # permissions, unpinned actions, credential persistence.
      #
      # advanced-security defaults to true and needs GitHub Advanced Security,
      # which this repo does not have; annotations put findings on the diff
      # instead. version defaults to "latest" — pinned so a zizmor release
      # cannot change what this gate means.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.29.0"
          advanced-security: false
          annotations: true
          persona: pedantic
          min-severity: low

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The release binary rather than gitleaks-action, pinned by version and
      # checked against the release's published SHA-256, so the scanner cannot
      # change underneath this gate.
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        run: ./gitleaks git . --redact --no-banner

  privacy:
    name: Personal content scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Public rules only: the owner's private terms file never leaves their machine.
      - name: Scan tracked files
        run: node tools/privacy-check.mjs --tree
      - name: Scan every commit
        run: node tools/privacy-check.mjs --history
